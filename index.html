<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GramPTC Test</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{background:#0e1116;color:#e6edf3;font-family:system-ui;padding:16px}
.k{color:#8b949e;font-size:12px;margin-top:12px}
.v{font-size:16px;word-break:break-all}
</style>
</head><body>
<h3>GramPTC · smoke test</h3>
<div class=k>Nama</div><div class=v id=name>-</div>
<div class=k>User ID</div><div class=v id=uid>-</div>
<div class=k>initData</div><div class=v id=init>-</div>
<div class=k>Platform</div><div class=v id=plat>-</div>
<script>
var tg = window.Telegram ? window.Telegram.WebApp : null;
if (!tg) {
  document.body.innerHTML = "<p>Dibuka di luar Telegram.</p>";
} else {
  tg.ready(); tg.expand();
  var u = tg.initDataUnsafe ? (tg.initDataUnsafe.user ? tg.initDataUnsafe.user : {}) : {};
  var fn = u.first_name ? u.first_name : "";
  var ln = u.last_name ? u.last_name : "";
  var un = u.username ? " @" + u.username : "";
  document.getElementById("name").textContent = fn + " " + ln + un;
  document.getElementById("uid").textContent = u.id ? u.id : "-";
  document.getElementById("init").textContent = tg.initData ? "ADA (" + tg.initData.length + " karakter)" : "KOSONG";
  document.getElementById("plat").textContent = tg.platform ? tg.platform : "-";
}
</script>
</body></html>
